name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Lua format
        run: nix develop --command stylua --check lua spec
      - name: Markdown format
        run: nix develop --command biome format .

  lint:
    name: Lint
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Lua lint
        run: nix develop --command selene --display-style quiet .

  typecheck:
    name: Typecheck
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Lua type check
        run: nix develop --command lua-language-server --check lua --configpath "$PWD/.luarc.json" --checklevel=Warning

  test:
    name: Test
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: nix develop --command busted
