name: quality

on:
  pull_request:
    branches: [main, canola]
  push:
    branches: [main, canola]
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Lua format
        run: nix develop .#ci --command stylua --check lua spec
      - name: Markdown format
        run: nix develop .#ci --command biome format .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Lua lint
        run: nix develop .#ci --command selene --display-style quiet .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Lua type check
        run: nix develop .#ci --command lua-language-server --check lua --configpath "$PWD/.luarc.json" --checklevel=Error

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Test
        run: nix develop .#ci --command busted
